# Applies new database migrations automatically whenever migration files change on main.
#
# Setup (one time): GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret  DATABASE_URL  = the Session pooler connection string
#   (Supabase → Connect → Session pooler, with the database password filled in).
# When you move to Lightsail, just replace the secret with the new database's URL.
name: Database migrations

on:
  push:
    branches: [master]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: {}

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preview
        run: npm run db:push -- --dry-run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply
        run: npm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
